name: "CI Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: "Detect Modified Paths"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for backend modifications
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/V.T.Thanh-Home-SpringBoot/**'
              - 'backend/Dockerfile'
              - 'backend/Dockerfile.dockerignore'
  gitleaks:
    name: "Secret Leak Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: "Lint Frontend and Backend"
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
        env:
          POSTGRES_DB: vtthanh_test
          POSTGRES_USER: vtthanh_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U vtthanh_test -d vtthanh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    needs: [gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: frontend/V.T.Thanh-Home-Angular/package-lock.json

      - name: Report Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Lint Backend
        run: |
          chmod +x backend/V.T.Thanh-Home-SpringBoot/gradlew
          ./backend/V.T.Thanh-Home-SpringBoot/gradlew -p backend/V.T.Thanh-Home-SpringBoot spotlessCheck checkstyleMain --no-daemon

      - name: Backend integration tests
        run: ./backend/V.T.Thanh-Home-SpringBoot/gradlew -p backend/V.T.Thanh-Home-SpringBoot test --no-daemon

      - name: Lint Frontend
        run: |
          npm --prefix frontend/V.T.Thanh-Home-Angular ci --include=dev --no-audit --no-fund
          npm --prefix frontend/V.T.Thanh-Home-Angular run lint

      - name: Frontend regression tests
        if: ${{ hashFiles('frontend/V.T.Thanh-Home-Angular/src/**/*.spec.ts', 'frontend/V.T.Thanh-Home-Angular/tests/**/*.spec.ts') != '' }}
        run: npm --prefix frontend/V.T.Thanh-Home-Angular test -- --watch=false

      - name: Verify browser test types and hosting configuration
        run: |
          npm --prefix frontend/V.T.Thanh-Home-Angular run typecheck:e2e
          npm --prefix frontend/V.T.Thanh-Home-Angular run check:hosting

  build-check:
    name: "App build check"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and Build Angular Production Bundle
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: frontend/V.T.Thanh-Home-Angular/package-lock.json
      - name: Report Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Build Angular Production Bundle
        env:
          SENTRY_DSN: ${{ github.event_name == 'pull_request' && 'https://public@example.invalid/1' || secrets.SENTRY_DSN }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "::error::Set the repository Actions secret SENTRY_DSN to the Angular project's DSN"
            exit 1
          fi
          npm --prefix frontend/V.T.Thanh-Home-Angular ci --include=dev --no-audit --no-fund
          npm --prefix frontend/V.T.Thanh-Home-Angular run build

      - name: Install pinned Chromium and system dependencies
        working-directory: frontend/V.T.Thanh-Home-Angular
        run: npm exec -- playwright install --with-deps --only-shell chromium

      - name: Verify production PWA in desktop and Android browser contexts
        working-directory: frontend/V.T.Thanh-Home-Angular
        run: npm run e2e:pwa

      - name: Verify the tested artifact remains intact
        working-directory: frontend/V.T.Thanh-Home-Angular
        run: npm run check:pwa

      - name: Upload PWA browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: pwa-browser-report
          path: |
            frontend/V.T.Thanh-Home-Angular/playwright-report
            frontend/V.T.Thanh-Home-Angular/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Angular Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: frontend-browser
          path: frontend/V.T.Thanh-Home-Angular/dist/V.T.Thanh-Home-Angular/browser
          if-no-files-found: error
          retention-days: 1

      - name: Build Spring Boot Production Docker Image
        run: docker build -t vtthanh-backend:test -f backend/Dockerfile .

      - name: Save Docker Image Artifact for Deep Scan
        run: |
          docker save vtthanh-backend:test -o /tmp/vtthanh-backend.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: backend-docker-image
          path: /tmp/vtthanh-backend.tar
          retention-days: 1

  security-deep-scan:
    name: "Deep Security Scan"
    needs: [build-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Download Built Backend Docker Image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: backend-docker-image
          path: /tmp

      - name: Load Docker Image into Runner Daemon
        run: docker load -i /tmp/vtthanh-backend.tar

      - name: Run Trivy Deep Image Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "vtthanh-backend:test"
          scan-type: "image"
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-image-results.sarif"

      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-docker-image"

  deploy:
    name: "Deploy Backend Image"
    needs: [security-deep-scan, changes]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/deployment-workflows.yml
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
