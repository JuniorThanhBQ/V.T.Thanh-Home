name: "CI Pipeline"

on:
  push:
  pull_request:

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: "Secret Leak Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: "Lint Frontend and Backend"
    needs: [gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/V.T.Thanh-Home-Angular/package-lock.json'

      - name: Lint Backend
        run: |
          chmod +x backend/V.T.Thanh-Home-SpringBoot/gradlew
          ./backend/V.T.Thanh-Home-SpringBoot/gradlew -p backend/V.T.Thanh-Home-SpringBoot spotlessCheck checkstyleMain --no-daemon

      - name: Lint Frontend
        run: |
          npm --prefix frontend/V.T.Thanh-Home-Angular ci
          npm --prefix frontend/V.T.Thanh-Home-Angular run lint


  build-check:
    name: "App build check"
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and Build Angular Production Bundle
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/V.T.Thanh-Home-Angular/package-lock.json'
      - run: |
          npm --prefix frontend/V.T.Thanh-Home-Angular ci
          npm --prefix frontend/V.T.Thanh-Home-Angular run build

      - name: Build Spring Boot Production Docker Image
        run: docker build -t vtthanh-backend:test -f backend/Dockerfile .

      - name: Save Docker Image Artifact for Deep Scan
        run: |
          docker save vtthanh-backend:test -o /tmp/vtthanh-backend.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: backend-docker-image
          path: /tmp/vtthanh-backend.tar
          retention-days: 1

  security-deep-scan:
    name: "Deep Security Scan"
    needs: [build-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Built Backend Docker Image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: backend-docker-image
          path: /tmp

      - name: Load Docker Image into Runner Daemon
        run: docker load -i /tmp/vtthanh-backend.tar

      - name: Run Trivy Deep Image Vulnerability Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'vtthanh-backend:test'
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-docker-image'

      - name: Serve Built Angular and Run OWASP ZAP Scan
        run: |
          npm --prefix frontend/V.T.Thanh-Home-Angular ci
          npm --prefix frontend/V.T.Thanh-Home-Angular run build

          npx http-server frontend/V.T.Thanh-Home-Angular/dist -p 4200 &
          sleep 3

      - name: OWASP ZAP Baseline Scan on Angular
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:4200'
          fail_action: false
