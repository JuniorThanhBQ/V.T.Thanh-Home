name: "Production Website Health Check"

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    name: "Check Vercel Deployment"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe Website Status
        run: bash scripts/ci/probe-website.sh

      - name: Probe Backend Status
        run: bash scripts/ci/probe-backend.sh

      - name: Scan URLs with VirusTotal
        env:
          VIRUS_TOTAL_KEY: ${{ secrets.VIRUS_TOTAL_KEY }}
        run: bash scripts/ci/scan-virustotal.sh

      - name: Scan URLs with Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/scan-cloudflare.sh

      - name: Deploy status.json to badges branch
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/deploy-badges.sh
