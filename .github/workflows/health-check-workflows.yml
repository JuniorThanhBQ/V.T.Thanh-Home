name: "Production Website Health Check"

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    name: "Check Vercel Deployment"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe Website Status
        run: bash scripts/ci/probe-website.sh

      - name: Probe Backend Status
        run: bash scripts/ci/probe-backend.sh

      - name: Scan URLs with VirusTotal
        env:
          VIRUS_TOTAL_KEY: ${{ secrets.VIRUS_TOTAL_KEY }}
        run: bash scripts/ci/scan-virustotal.sh

      - name: Scan URLs with Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ci/scan-cloudflare.sh

      - name: Log in to Docker Hub
        id: scout-login
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Scan published backend image
        id: scout
        if: steps.scout-login.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: registry://juniorthanh09/vtthanh-backend:latest
          platform: linux/amd64
          exit-code: false
          summary: true
          write-comment: false

      - name: Generate image vulnerability badge
        env:
          SCOUT_OUTCOME: ${{ steps.scout.outcome }}
          SCOUT_REPORT: ${{ steps.scout.outputs.cves }}
        run: python3 scripts/ci/generate-image-vulnerability-badge.py

      - name: Deploy status badges to badges branch
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/deploy-badges.sh
