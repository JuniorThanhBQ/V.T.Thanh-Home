name: "Daily Security Audit"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: security-daily-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sca-scan:
    name: "SCA and Container Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e4856f6424a13223126f5d72f107127b40 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          ignore-unfixed: false
          severity: "HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-sca"

  sast-scan:
    name: "Deep Code SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e4856f6424a13223126f5d72f107127b40 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b \
            semgrep scan --config auto --sarif --output=/src/semgrep.sarif || true

      - name: Upload Semgrep SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: "semgrep.sarif"
          category: "semgrep-sast"

  scorecard-audit:
    name: "Supply Chain and Posture"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e4856f6424a13223126f5d72f107127b40 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.2
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: "scorecard-results.sarif"
          category: "openssf-scorecard"

  dast-scan:
    name: "Live DAST Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e4856f6424a13223126f5d72f107127b40 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "https://vtthanh-home-angular.vercel.app/"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          fail_action: false

      - name: Upload ZAP SARIF Report to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: "report_sarif.json"
          category: "zap-dast"
