name: "CodeQL Advanced Security Analysis"

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "30 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # This security scan job requires write access in order to upload SARIF results and create issues for any detected vulnerabilities.
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          build-mode: ${{ matrix.build-mode }}

      - name: Build Spring Boot Backend for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x backend/V.T.Thanh-Home-SpringBoot/gradlew
          ./backend/V.T.Thanh-Home-SpringBoot/gradlew -p backend/V.T.Thanh-Home-SpringBoot classes testClasses --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
