<footer
  class="border-t border-slate-200 dark:border-slate-800 bg-white/85 dark:bg-slate-900/75 backdrop-blur-md py-4 sm:py-3.5 text-xs text-slate-600 dark:text-slate-400 transition-colors duration-300"
>
  <div
    class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-2.5 sm:gap-2"
  >
    <div class="animate-stagger-item text-center md:text-left text-[11px] sm:text-xs">
      © {{ currentYear }}
      <span class="font-semibold text-slate-800 dark:text-slate-200">{{
        i18n.t('app.Author')
      }}</span
      >. {{ i18n.t('app.copyright') }}.
    </div>

    <div
      class="animate-stagger-item flex flex-wrap items-center justify-center md:justify-end gap-x-2.5 gap-y-1 text-[11px] sm:text-xs text-slate-500 dark:text-slate-400"
    >
      <span class="font-mono text-slate-700 dark:text-slate-300 tabular-nums">
        {{ currentTime() | date: 'yyyy-MM-dd HH:mm:ss' }} (UTC+7)
      </span>

      <span class="text-slate-300 dark:text-slate-700 select-none">|</span>

      <span class="inline-flex items-center gap-1 font-mono text-slate-700 dark:text-slate-300">
        <svg
          class="w-3.5 h-3.5 text-slate-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
          />
        </svg>
        {{ viewersCount !== null ? viewersCount : '---' }}
      </span>

      <span class="text-slate-300 dark:text-slate-700 select-none">|</span>

      <span class="font-mono text-slate-700 dark:text-slate-300">
        {{ i18n.t('app.version') }}
      </span>
    </div>
  </div>
</footer>
