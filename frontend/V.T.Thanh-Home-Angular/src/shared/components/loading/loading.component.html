<div
  class="fixed inset-0 z-[99999] w-full h-[100dvh] flex flex-col justify-between p-6 sm:p-10 md:p-16 mesh-loader text-slate-900 dark:text-white select-none"
  [class.transition-transform]="curtainLifted()"
  [class.duration-700]="curtainLifted()"
  [class.ease-[cubic-bezier(0.77,0,0.175,1)]]="curtainLifted()"
  [class.-translate-y-full]="curtainLifted()"
  [class.pointer-events-none]="curtainLifted()"
>
  <div
    class="flex w-full items-center justify-between text-[11px] sm:text-xs font-mono tracking-wider sm:tracking-widest text-slate-500 dark:text-slate-400"
  >
    <div class="flex items-center min-w-0 pr-2">
      <span class="text-slate-800 dark:text-slate-200 uppercase font-semibold truncate">{{
        i18n.t('loading.subtitle')
      }}</span>
    </div>
    <span class="text-slate-400 dark:text-slate-500 uppercase hidden sm:inline shrink-0 ml-auto">{{
      i18n.t('loading.tech_stack')
    }}</span>
  </div>

  <div class="flex flex-col items-center justify-center my-auto px-4">
    <div class="relative flex items-center justify-center">
      <div
        class="absolute w-24 h-24 sm:w-32 sm:h-32 rounded-full bg-sky-500/10 blur-xl animate-pulse"
      ></div>
      <span
        class="relative font-mono text-2xl sm:text-4xl md:text-5xl font-bold tracking-tight text-slate-900 dark:text-white drop-shadow-[0_0_20px_rgba(56,189,248,0.25)] text-center"
      >
        {{ i18n.t('app.Author') }}
      </span>
    </div>
  </div>

  <div class="flex flex-col space-y-2.5 sm:space-y-3">
    <div class="flex items-end justify-between font-mono gap-2">
      <span
        class="text-[11px] sm:text-xs uppercase tracking-wider sm:tracking-widest text-sky-600 dark:text-sky-400 font-semibold truncate mr-2"
      >
        {{ i18n.t('loading.initializing') }}
      </span>
      <span
        class="text-3xl sm:text-5xl font-bold tracking-tighter text-slate-900 dark:text-white tabular-nums shrink-0"
      >
        {{ progress() }}%
      </span>
    </div>
    <div class="w-full h-1 sm:h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
      <div
        class="h-full bg-gradient-to-r from-sky-500 to-indigo-500 transition-all duration-75 ease-out"
        [style.width.%]="progress()"
      ></div>
    </div>
  </div>
</div>
