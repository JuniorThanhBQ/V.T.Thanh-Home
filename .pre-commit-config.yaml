fail_fast: false
default_stages: [pre-commit, pre-merge-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
        exclude: ^(\.github/|frontend/|backend/)
      - id: check-json
        exclude: (?i)(\.vscode/|tsconfig.*\.json|angular\.json)
      - id: check-xml
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or:
          [javascript, jsx, ts, tsx, html, css, scss, json, yaml, markdown]
        exclude: |
          (?x)^(
            package-lock\.json|
            .*\.min\..*|
            frontend/V\.T\.Thanh-Home-Angular/package-lock\.json
          )$

  - repo: local
    hooks:
      - id: gradle-spotless
        name: gradle spotless check
        entry: cmd /c "cd backend\V.T.Thanh-Home-SpringBoot && gradlew.bat spotlessCheck"
        language: system
        files: ^backend/V\.T\.Thanh-Home-SpringBoot/.*\.java$
        pass_filenames: false
