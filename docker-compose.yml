services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend-springboot
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE?Unset variable SPRING_PROFILES_ACTIVE}
      SENTRY_DSN: ${SENTRY_DSN:?Unset variable SENTRY_DSN}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-true}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-vtthanh-home-springboot@0.0.1}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB?Unset variable POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER?Unset variable POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD?Unset variable POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVER_PORT?Unset variable SERVER_PORT}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHAT_FILE_URL: ${CHAT_FILE_URL:-}
      APP_MAIL_WORKER_ENABLED: ${CONTACT_EMAIL_DELIVERY_ENABLED:-false}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-}
      EMAILS_RECIPIENT_EMAIL: ${EMAILS_RECIPIENT_EMAIL:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-localhost,127.0.0.1,www.juniorthanh.id.vn}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      CHAT_DAILY_GENERATION_LIMIT: ${CHAT_DAILY_GENERATION_LIMIT:-200}
      CHAT_MODEL: ${CHAT_MODEL:-openai/gpt-oss-120b}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
    ports:
      - "${SERVER_PORT?Unset variable SERVER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
  db:
    image: pgvector/pgvector:pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB?Unset variable POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER?Unset variable POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Unset variable POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT?Unset variable POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  adminer:
    image: adminer:6@sha256:49a7d30e71de97fb18933ffe7d46cc2b343c49fd7a63a7791c8be2548eb65115
    restart: unless-stopped
    ports:
      - "5243:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

networks:
  default:
    name: vtthanh-home-network
    driver: bridge
