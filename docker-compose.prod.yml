services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend-springboot-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL?Unset variable SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME?Unset variable SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD?Unset variable SPRING_DATASOURCE_PASSWORD}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://vtthanh-home-angular.vercel.app}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CHAT_FILE_URL: ${CHAT_FILE_URL:-}
      CHAT_DAILY_GENERATION_LIMIT: ${CHAT_DAILY_GENERATION_LIMIT:-200}
      CHAT_MODEL: ${CHAT_MODEL:-openai/gpt-oss-20b}
      APP_MAIL_WORKER_ENABLED: ${CONTACT_EMAIL_DELIVERY_ENABLED:-true}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-}
      EMAILS_RECIPIENT_EMAIL: ${EMAILS_RECIPIENT_EMAIL:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-vtthanh-home-angular.vercel.app}
    ports:
      - "${SERVER_PORT:-8080}:8080"
