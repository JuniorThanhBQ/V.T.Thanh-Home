app:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://vtthanh-home-angular.vercel.app}
  mail:
    worker-enabled: ${CONTACT_EMAIL_DELIVERY_ENABLED:true}
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}
    from-email: ${EMAILS_FROM_EMAIL:thanh.vantrung2005@gmail.com}
    from-name: ${EMAILS_FROM_NAME:V.T.Thanh}
    recipient-email: ${EMAILS_RECIPIENT_EMAIL:thanh.vantrung2005@gmail.com}
  turnstile:
    enabled: ${TURNSTILE_ENABLED:false}
    site-key: ${TURNSTILE_SITE_KEY:}
    hostnames: ${TURNSTILE_HOSTNAMES:vtthanh-home-angular.vercel.app}
    secret-key: ${TURNSTILE_SECRET_KEY:}
  chat:
    daily-generation-limit: ${CHAT_DAILY_GENERATION_LIMIT:200}
    groq-api-keys: ${GROQ_API_KEYS:}
    groq-api-key: ${GROQ_API_KEY:}
    file-url: ${CHAT_FILE_URL:}
    model: ${CHAT_MODEL:openai/gpt-oss-20b}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/xml,text/plain,application/javascript

spring:
  application:
    name: V.T.Thanh-Home-Backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/vtthanh_db}
    username: ${SPRING_DATASOURCE_USERNAME:vtthanh_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    enabled: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    root: INFO
    com.vtthanh: INFO
    org.hibernate.SQL: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
